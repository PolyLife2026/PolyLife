<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PolyLife فروشگاه{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    /* ── PolyLife Color Palette ───────────────────────────────── */
    :root {
      --primary:      #185E64;
      --p-light:      #BCDADD;
      --p-vlight:     #CDF1F4;
      --cream:        #FDE6C3;
      --gray:         #D9D9D9;
      --black:        #000000;
      --white:        #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #f5f7f8;
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ─────────────────────────────────────────────────── */
    .navbar {
      background: var(--primary);
      color: white;
      padding: 0 1.5rem;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .navbar-logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: .5px;
    }
    .navbar-links { display: flex; gap: .5rem; align-items: center; }
    .navbar-links a {
      color: var(--white);
      text-decoration: none;
      padding: .35rem .75rem;
      border-radius: 6px;
      font-size: .88rem;
      transition: background .15s;
    }
    .navbar-links a:hover { background: rgba(255,255,255,.18); }
    .navbar-cart {
      background: var(--cream) !important;
      color: var(--primary) !important;
      font-weight: 700;
    }
    .cart-cnt {
      background: #e74c3c;
      color: #fff;
      border-radius: 50%;
      padding: 1px 5px;
      font-size: .7rem;
      margin-right: 3px;
    }
    .navbar .nav-auth-btn {
        display: inline-flex;
        align-items: center;

        padding: 8px 16px;
        margin-right: 8px;

        border-radius: 8px;

        background: #f8e8c8;
        color: #17616a !important;

        font-weight: bold;
        text-decoration: none;
    }
    .nav-auth-btn:hover {
        opacity: 0.85;
    }
    /* ── Layout ─────────────────────────────────────────────────── */
    main { flex: 1; max-width: 1180px; margin: 0 auto; width: 100%; padding: 1.5rem 1rem; }

    footer {
      background: var(--primary);
      color: var(--p-light);
      text-align: center;
      padding: .9rem;
      font-size: .82rem;
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .5rem 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Vazirmatn', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover   { opacity: .88; transform: translateY(-1px); }
    .btn:active  { transform: translateY(0); }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--cream); color: var(--primary); }
    .btn-outline   { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-danger    { background: #e74c3c; color: #fff; }
    .btn-outline:hover {
        background: var(--primary);
        color: white;
    }
    .btn-sm { padding: .3rem .75rem; font-size: .8rem; }
    .btn-full { width: 100%; }

    /* ── Cards ─────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      border: 1px solid var(--gray);
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .card:hover { box-shadow: 0 5px 20px rgba(24,94,100,.15); }

    /* ── Headings ─────────────────────────────────────────────── */
    .page-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      border-right: 4px solid var(--cream);
      padding-right: .75rem;
      margin-bottom: 1.2rem;
    }

    /* ── Alerts ─────────────────────────────────────────────── */
    .alert { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .88rem; }
    .alert-info    { background: var(--p-vlight); color: var(--primary); border: 1px solid var(--p-light); }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error   { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6cb; }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      border: 3px solid var(--gray);
      border-top-color: var(--primary);
      border-radius: 50%;
      width: 36px; height: 36px;
      animation: spin .7s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast-box {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      pointer-events: none;
    }
    .toast {
      background: var(--primary);
      color: #fff;
      padding: .65rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      animation: slideup .25s ease;
      font-size: .88rem;
    }
    .toast.ok  { background: #27ae60; }
    .toast.err { background: #e74c3c; }
    @keyframes slideup {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Helpers ─────────────────────────────────────────────── */
    .text-primary { color: var(--primary); }
    .text-muted   { color: #666; font-size: .85rem; }
    .fw-bold      { font-weight: 700; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .gap-1 { gap: .5rem; }
    .flex  { display: flex; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .auth-container {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }


    .auth-card {
        width: 380px;
        background: white;

        padding: 35px;

        border-radius: 16px;

        box-shadow:
            0 8px 25px rgba(0,0,0,.12);

        text-align: right;
    }


    .auth-card h1 {
        color: #17616a;
        text-align: center;
        margin-bottom: 30px;
    }


    .auth-card label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }


    .auth-card input {
        width: 100%;
        box-sizing: border-box;

        padding: 12px;

        margin-bottom: 20px;

        border-radius: 8px;

        border: 1px solid #ccc;

        font-size: 16px;
    }


    .auth-submit {
        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background: #17616a;

        color: white;

        font-size: 18px;

        cursor: pointer;
    }


    .auth-submit:hover {
        opacity: .9;
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-logo">🏋️ PolyLife</a>
  <div class="navbar-links">
    <a href="/">فروشگاه</a>
    <a href="/store/products/">محصولات</a>
    <a href="/cart/" class="navbar-cart">
      🛒 سبد <span class="cart-cnt" id="cart-cnt" style="display:none">0</span>
    </a>
    <a href="/orders/">سفارشات</a>
    <a id="login-link" href="/login/" class="nav-auth-btn">
        ورود
    </a>

    <a id="logout-link"
      href="#"
      onclick="logout(); return false;"
      class="nav-auth-btn"
      style="display:none">
        خروج
    </a>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer><p>© PolyLife — فروشگاه مکمل‌های ورزشی و تجهیزات | تیم ۴</p></footer>

<div id="toast-box"></div>

<script>
/* ── Shared helpers ─────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", () => {
    const token = localStorage.getItem("polylife_token");

    if (token) {
        document.getElementById("login-link").style.display = "none";
        const username = localStorage.getItem("polylife_username");
        const logoutLink = document.getElementById("logout-link");
        logoutLink.style.display = "inline-block";

        if (username) {
            logoutLink.innerHTML = `خروج (${username})`;
        }
            }
});
function toast(msg, type='') {
  const box = document.getElementById('toast-box');
  const el  = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function price(n) {
  return Number(n).toLocaleString('fa-IR') + ' تومان';
}

function getAuthToken() {
  return localStorage.getItem('polylife_token') || '';
}

function logout() {
  localStorage.removeItem('polylife_token');
  localStorage.removeItem('polylife_username');
  window.location.href = '/';
}

async function authFetch(url, options = {}) {
  const token = getAuthToken();

  if (!token) {
    const next = encodeURIComponent(
      window.location.pathname + window.location.search
    );
    window.location.href = `/login/?next=${next}`;
    throw new Error('Authentication required');
  }

  const headers = new Headers(options.headers || {});
  headers.set('Authorization', `Bearer ${token}`);

  const response = await fetch(url, {
    ...options,
    headers,
  });

  if (
    response.status === 401 ||
    response.status === 403 ||
    response.status === 302
  ){
    localStorage.removeItem('polylife_token');
    localStorage.removeItem('polylife_username');

    const next = encodeURIComponent(
      window.location.pathname + window.location.search
    );
    window.location.href = `/login/?next=${next}`;
  }

  return response;
}
async function updateCartBadge() {
  try {
    const token = getAuthToken();
    if (!token) return;
    const r = await authFetch('/api/cart/');
    if (!r.ok) return;
    const d = await r.json();
    const cnt = (d.items || []).length;
    const el  = document.getElementById('cart-cnt');
    if (cnt > 0) { el.textContent = cnt; el.style.display = 'inline'; }
    else          { el.style.display = 'none'; }
  } catch {}
}
function requireLogin() {
    const token = localStorage.getItem("polylife_token");

    if (!token) {
        const next = encodeURIComponent(
            window.location.pathname + window.location.search
        );

        window.location.href = `/login/?next=${next}`;
        return false;
    }

    return true;
}
updateCartBadge();
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
