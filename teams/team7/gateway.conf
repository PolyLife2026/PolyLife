# Team team7 gateway (nginx).
# Authenticates every /api/ request against the core, then proxies to this
# team's backend.
#
# Upstreams are resolved at request time via Docker's embedded DNS (127.0.0.11)
# and variable proxy_pass — so the gateway STARTS even before your backend
# exists (then /api/ just returns 502 until you add it).
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    # Ask the core: is this request authenticated? (forward-auth)
    location = /_auth {
        internal;
        set $core_verify http://core:8000/api/verify;
        proxy_pass              $core_verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization $http_authorization;
        proxy_set_header        Cookie $http_cookie;
    }

    # Same-origin proxy for Core's login/refresh/logout endpoints. Core's
    # frontend stores JWTs in origin-scoped localStorage, so the Team 7 page
    # cannot read tokens created on localhost:8000 directly.
    location /auth/ {
        set $core_api http://core:8000;
        rewrite ^/auth/(.*)$ /api/$1 break;
        proxy_pass       $core_api;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
    }

    # Protected API: only reaches the backend if the core says "OK".
    location /api/ {
        auth_request /_auth;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_name $upstream_http_x_user_username;
        proxy_set_header X-User-Id       $user_id;
        proxy_set_header X-User-Username $user_name;

        # FastAPI routers are mounted at /chat and /reserve; public clients
        # reach them through /api/chat and /api/reserve.
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass       $backend;
        proxy_set_header Host $host;
    }

    # WebSocket route for chat. This must opt into HTTP/1.1 upgrade
    # semantics, otherwise Nginx will downgrade the connection and the
    # handshake will fail before the backend sees the request.
    location = /api/chat/ws {
        auth_request /_auth;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_name $upstream_http_x_user_username;
        proxy_set_header X-User-Id       $user_id;
        proxy_set_header X-User-Username $user_name;

        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass       $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Static HTML/JS frontend for chat with coach and reserve coach.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # AJAX callers need a real 401. Redirecting a fetch to Core's different
    # origin is surfaced by browsers as a misleading CORS/network error.
    error_page 401 = @needs_login;
    location @needs_login {
        default_type application/json;
        return 401 '{"detail":"Authentication required"}';
    }
}
