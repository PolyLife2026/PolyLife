services:
  gateway:
    image: nginx:alpine
    ports:
      - "${TEAM_PORT}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - CORE_BASE_URL=${CORE_BASE_URL}
    networks: [polylife, team]
    depends_on: [backend]

  backend:
    build: .
    env_file: .env
    depends_on: [db]
    networks: [team]

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [team]

volumes:
  db-data:

networks:
  polylife:
    external: true
    name: polylife_net
  team:
