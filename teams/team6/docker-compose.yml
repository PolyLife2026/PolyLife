services:
  gateway:
    image: nginx:alpine
    container_name: team6_gateway
    ports:
      - "${TEAM_PORT:-9106}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - polylife_net
    restart: unless-stopped

  backend:
    build:
      # docker-compose.yml داخل teams/team6 است.
      # ../.. به ریشه پروژه PolyLife می‌رسد.
      context: ../..
      dockerfile: teams/team6/Dockerfile.backend

    container_name: team6_backend
    restart: unless-stopped

    environment:
      TEAM_APPS: teams.team6

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-team6_user}:${POSTGRES_PASSWORD:-team6_password}@db:5432/${POSTGRES_DB:-team6_db}

      DJANGO_ALLOWED_HOSTS: "backend,team6_backend,localhost,127.0.0.1"

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn polylife.wsgi:application
      --bind 0.0.0.0:8000
      "

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - polylife_net
      - team6_private

  db:
    image: postgres:16-alpine
    container_name: team6_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team6_db}
      POSTGRES_USER: ${POSTGRES_USER:-team6_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-team6_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-team6_user} -d ${POSTGRES_DB:-team6_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - team6_private

networks:
  polylife_net:
    external: true
    name: polylife_net

  team6_private:
    driver: bridge

volumes:
  postgres_data: