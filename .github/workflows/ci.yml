name: CI

on:
  push:
  pull_request:

jobs:

  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run core tests
        run: python manage.py test core


  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the core image (frontend + backend)
        run: docker compose build


  team4-test:
    name: Team 4 backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: teams/team4/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: teams/team4/backend/requirements.txt

      - name: Install Team 4 dependencies
        run: pip install -r requirements.txt

      - name: Run Team 4 tests
        run: python manage.py test


  team4-docker-build:
    name: Team 4 Docker image build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Team 4 backend image
        run: |
          docker build \
            -f teams/team4/Dockerfile \
            -t polylife-team4 \
            teams/team4